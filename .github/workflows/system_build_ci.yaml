name: Docker Compose CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1
  POSTGRES_USER_DB: test_db
  POSTGRES_USER_USER: test_user
  POSTGRES_USER_PASSWORD: test_password
  POSTGRES_MEASUREMENTS_DB: measurements_db
  POSTGRES_MEASUREMENTS_USER: measurements_user
  POSTGRES_MEASUREMENTS_PASSWORD: measurements_pass
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker build -t gateway-image -f ./gnss-api-gateway/Dockerfile .
          docker build -t auth-image -f ./gnss-auth/Dockerfile .
          docker build -t user-image -f ./gnss-user/Dockerfile .
          docker build -t measurements-image -f ./gnss-measurements/Dockerfile .
          docker build -t satellites-image -f ./gnss-satellites/Dockerfile .

      - name: Generate gRPC code
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.28
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.2
          export PATH="$PATH:$(go env GOPATH)/bin"
          make generate

      - name: Start services
        run: |
          docker network create gnss-radar-net || true
          docker-compose -f docker-compose.yaml up -d
          docker-compose ps

      - name: Wait for services
        run: |
          echo "Waiting for services to become healthy..."
          timeout 180s bash -c 'while [[ $(docker-compose ps --services --filter "status=running" | wc -l) -lt 7 ]]; do sleep 5; done'
          docker-compose ps

      - name: Clean up
        if: always()
        run: |
          docker-compose -f docker-compose.yaml down
          docker system prune -f