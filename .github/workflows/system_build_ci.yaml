name: Docker Compose CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  ENV: docker
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1
  POSTGRES_USER_DB: test_db
  POSTGRES_USER_USER: test_user
  POSTGRES_USER_PASSWORD: test_password
  POSTGRES_MEASUREMENTS_DB: measurements_db
  POSTGRES_MEASUREMENTS_USER: measurements_user
  POSTGRES_MEASUREMENTS_PASSWORD: measurements_pass
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare database files
        run: |
          # Создаем все необходимые директории рекурсивно
          mkdir -p postgres-migrations/user
          mkdir -p postgres-migrations/measurements
          mkdir -p postgres-data
          mkdir -p postgres-measurements-data
          mkdir -p /home/runner/postgres-migrations/tasks
          mkdir -p /home/runner/postgres-migrations/measurements/initdb.sql
          mkdir -p /home/runner/postgres-tasks-data
          mkdir -p /home/runner/postgres-migrations/user/
          
          cp ./scripts/sql/init/init_db.sql postgres-migrations/user/initdb.sql
          cp ./scripts/sql/init/init_db.sql postgres-migrations/measurements/initdb.sql
          cp ./scripts/sql/init/init_db.sql postgres-migrations/user/initdb.sql
          cp ./scripts/sql/init/init_db.sql /home/runner/postgres-migrations/tasks/initdb.sql
          cp ./scripts/sql/init/init_db.sql /home/runner/postgres-migrations/measurements/initdb.sql
          cp ./scripts/sql/init/init_db.sql /home/runner/postgres-migrations/user/initdb.sql

      - name: Build Docker images
        run: make build-images

      # - name: Generate gRPC code
      #   run: make generate

      - name: Start network
        run: make start-networks

      - name: Start services
        run: make start-services

      - name: Wait for services
        run: |
          echo "Waiting for services to become healthy..."
          timeout 180s bash -c 'while [[ $(docker compose ps --services --filter "status=running" | wc -l) -lt 7 ]]; do sleep 5; done'
          docker compose ps