version: '3.8'
services:
  service-redis-auth:
    image: redis:7
    container_name: db-redis-auth
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - gnss-auth-subnet
    # healthcheck:
    #   test: ["CMD", "redis-cli", "ping"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3

  service-postgres-user:
    image: "postgres:14"
    container_name: db-postgres-user
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_USER_DB}
      POSTGRES_USER: ${POSTGRES_USER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
    volumes:
      - type: bind
        source: ~/postgres-migrations/user/initdb.sql
        target: /docker-entrypoint-initdb.d/migration_a.sql
      - type: bind
        source: ~/postgres-data
        target: /var/lib/postgresql/data
    # healthcheck:
    #   test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER_USER} -d ${POSTGRES_USER_DB}" ]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    networks:
      - gnss-user-subnet

  service-postgres-measurements:
    image: "postgres:14"
    container_name: db-postgres-measurements
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_MEASUREMENTS_DB}
      POSTGRES_USER: ${POSTGRES_MEASUREMENTS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MEASUREMENTS_PASSWORD}
    volumes:
      - type: bind
        source: ~/postgres-migrations/measurements/initdb.sql
        target: /docker-entrypoint-initdb.d/migration_a.sql
      - type: bind
        source: ~/postgres-measurements-data
        target: /var/lib/postgresql/data
    # healthcheck:
    #   test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER_USER} -d ${POSTGRES_USER_DB}" ]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    networks:
      - gnss-measurements-subnet

  service-postgres-tasks:
    image: "postgres:14"
    container_name: db-postgres-tasks
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_TASKS_DB}
      POSTGRES_USER: ${POSTGRES_TASKS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TASKS_PASSWORD}
    volumes:
      - type: bind
        source: ~/postgres-migrations/tasks/initdb.sql
        target: /docker-entrypoint-initdb.d/migration_a.sql
      - type: bind
        source: ~/postgres-tasks-data
        target: /var/lib/postgresql/data
    # healthcheck:
    #   test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_TASKS_USER} -d ${POSTGRES_TASKS_DB}" ]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    networks:
      - gnss-tasks-subnet

  minio-s3:
    container_name: s3
    image: minio/minio
    restart: always
    ports:
      - 9001:9001
      - 9000:9002
    volumes:
      - type: bind
        source: .
        target: /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" --address ":9002" /data
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:9002/minio/health/live"]
    #   interval: 5s
    #   retries: 3
    #   timeout: 5s
    networks:
      - gnss-measurements-subnet
      - gnss-radar-net
  create-buckets:
    container_name: s3-creator
    image: minio/mc
    depends_on:
      - minio-s3
    environment:
      MC_HOST_gnss: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@s3:9002
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set gnss http://s3:9002 \$${MINIO_ROOT_USER} \$${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing gnss/${TLE_BUCKET};
      exit 0;
      "
    networks:
      - gnss-measurements-subnet

  gnss-api-gateway:
    image: gateway-image:latest
    container_name: gateway
    restart: always
    ports:
      - 8000:8000
    # healthcheck:
    #   test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://localhost:8000/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    networks:
      - gnss-radar-net

  gnss-auth:
    image: auth-image:latest
    container_name: auth
    restart: always
    depends_on:
      - service-redis-auth
    # healthcheck:
    #   test: ["CMD", "grpc_health_probe", "-addr=:8001"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 15s
    #   start_interval: 5s
    networks:
      - gnss-radar-net
      - gnss-auth-subnet

  gnss-user:
    image: user-image:latest
    container_name: user
    restart: always
    environment:
      PG_ADDR: ${DATABASE_USER_URL}
    depends_on:
      - service-postgres-user
    # healthcheck:
    #   test: ["CMD", "grpc_health_probe", "-addr=:8002"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 15s
    #   start_interval: 5s
    networks:
      - gnss-radar-net
      - gnss-user-subnet

  gnss-measurements:
    image: measurements-image:latest
    container_name: measurements
    restart: always
    environment:
      PG_ADDR: ${DATABASE_MEASUREMENTS_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      EPHEMERIS_BUCKET_NAME: ${TLE_BUCKET}
      SATELLITES_ADDR: "http://satellites:8010"
    depends_on:
      - service-postgres-measurements
      - minio-s3
    # healthcheck:
    #   test: ["CMD", "grpc_health_probe", "-addr=:8003"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 15s
    #   start_interval: 5s
    networks:
      - gnss-radar-net
      - gnss-measurements-subnet

  gnss-tasks:
    image: tasks-image:latest
    container_name: tasks
    restart: always
    environment:
      PG_ADDR: ${DATABASE_TASKS_URL}
    depends_on:
      - service-postgres-tasks
    # healthcheck:
    #   test: ["CMD", "grpc_health_probe", "-addr=:8004"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 15s
    #   start_interval: 5s
    networks:
      - gnss-radar-net
      - gnss-tasks-subnet

  gnss-satellites:
    image: satellites-image:latest
    container_name: satellites
    restart: always
    networks:
      - gnss-measurements-subnet
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TLE_BUCKET: ${TLE_BUCKET}
      S3_ENDPOINT_URL: "http://s3:9002"

networks:
  gnss-radar-net:
    driver: bridge
    external: true
  gnss-user-subnet:
    driver: bridge
  gnss-auth-subnet:
    driver: bridge
  gnss-measurements-subnet:
    driver: bridge
  gnss-tasks-subnet:
    driver: bridge
