# Конфигурация mypy
[mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = '''
(
    \.git
  | \.venv
  | venv
  | migrations
  | docs
)
'''

# Конфигурация black
[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | migrations
  | docs
)/
'''