syntax = "proto3";

option go_package = "gnss-radar/api/proto/common";

message UserId {
    string userId = 1;
}

message Status {
  bool isOk = 1;
}

message PaginatedRequest {
    uint64 page = 1;
    uint64 size = 2;
}

